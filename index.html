      /* ============================================
         SISTEMA TIPOGRÁFICO PADRONIZADO - ARIAL
         ============================================ */
      
      * {
        font-family: Arial, Helvetica, sans-serif !important;
      }
      
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.5;
      }
      
      /* Títulos */
      h1, .text-2xl, .text-xl {
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      
      h2, h3, .text-lg {
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      
      /* Texto normal */
      p, span, div, label {
        font-weight: 400;
      }
      
      /* Texto bold */
      .font-bold, b, strong {
        font-weight: 700 !important;
      }
      
      .font-semibold {
        font-weight: 600 !important;
      }
      
      .font-medium {
        font-weight: 500 !important;
      }
      
      /* Valores monetários - mantém monospace para alinhamento */
      .font-mono {
        font-family: Arial, Helvetica, sans-serif !important;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
      }
      
      /* Tamanhos padronizados */
      .text-xs { font-size: 11px !important; line-height: 1.4; }
      .text-sm { font-size: 13px !important; line-height: 1.5; }
      .text-base { font-size: 14px !important; line-height: 1.5; }
      .text-lg { font-size: 16px !important; line-height: 1.4; }
      .text-xl { font-size: 18px !important; line-height: 1.3; }
      .text-2xl { font-size: 22px !important; line-height: 1.2; }
      .text-3xl { font-size: 28px !important; line-height: 1.1; }
      
      /* Labels pequenos (categorias, badges) */
      .text-\[10px\], .text-\[9px\] { 
        font-size: 10px !important; 
        line-height: 1.3;
        font-weight: 600;
      }
      
      /* Inputs */
      input, select, textarea {
        font-family: Arial, Helvetica, sans-serif !important;
        font-size: 14px;
        font-weight: 400;
      }
      
      /* Botões */
      button {
        font-family: Arial, Helvetica, sans-serif !important;
        font-weight: 600;
      }
      
      /* Scrollbar */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.3); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(150,150,150,0.5); }

      /* Mobile safety */
      .break-anywhere { overflow-wrap: anywhere; word-break: break-word; }
      
      /* Classes utilitárias de cores por módulo */
      .module-cartao { color: var(--color-cartao); }
      .module-obras { color: var(--color-obras); }
      .module-fixos { color: var(--color-fixos); }
      .module-fluxo { color: var(--color-fluxo); }
      .module-patrimonio { color: var(--color-patrimonio); }
      
      .border-module-cartao { border-color: rgba(16, 185, 129, 0.3); }
      .border-module-obras { border-color: rgba(59, 130, 246, 0.3); }
      .border-module-fixos { border-color: rgba(249, 115, 22, 0.3); }
      .border-module-fluxo { border-color: rgba(6, 182, 212, 0.3); }
      .border-module-patrimonio { border-color: rgba(139, 92, 246, 0.3); }
      
      /* Animação suave para transições */
      .transition-theme {
        transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease;
      }

        // Recharts do global
        const {

        // --- Utilitários ---
        const formatCurrency = (value) => {
          if (value === null || value === undefined || isNaN(value)) return 'R$ 0,00';
          return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        };

        const getMonthName = (date) => date.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
        const getShortMonth = (date) => date.toLocaleString('pt-BR', { month: 'short' }).toUpperCase().replace('.', '');

        // Função para exportar extrato em PDF
        const exportExtratoPDF = (transactions, cardMetrics, currentDate, filteredTransactions) => {
          try {
            if (!transactions || transactions.length === 0) {
              alert('Nenhuma transação para exportar');
              return;
            }
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            let yPos = 15;
            const lineHeight = 6;
            const margin = 10;

            // Cores das categorias (hex)
            const categoryColors = {
              'Alimentação': '#10b981',
              'Transporte': '#3b82f6',
              'Lazer': '#8b5cf6',
              'Compras': '#f97316',
              'Saúde': '#06b6d4',
              'Educação': '#6366f1',
              'Moradia': '#ec4899',
              'Utilities': '#f59e0b',
              'Outros': '#64748b'
            };

            // Separar transações por tipo
            // Meus gastos: gastos normais + minha metade dos divididos
            const gastosNormais = transactions.filter(t => !t.isAdditionalCard && !t.isSplit);
            const cartaoAdicional = transactions.filter(t => t.isAdditionalCard);
            const divididos = transactions.filter(t => t.isSplit && !t.isAdditionalCard);
            
            // Para meusGastos, incluir gastos normais + versão "minha parte" dos divididos
            const meusGastos = [
              ...gastosNormais,
              ...divididos.map(t => ({
                ...t,
                description: t.description + ' (minha parte)',
                totalAmount: t.myShare || 0,
                _isMinhaParteDividido: true
              }))
            ];
            
            // Para a seção "Compras Divididas", mostrar a parte da outra pessoa
            const parteOutraPessoa = divididos.map(t => ({
              ...t,
              description: t.description + ' (' + (t.splitWith || 'outra pessoa') + ')',
              totalAmount: (t.totalAmount || 0) - (t.myShare || 0),
              _isParteOutraPessoa: true
            }));

            // Calcular totais
            const totalMeusGastos = meusGastos.reduce((acc, t) => acc + (t.totalAmount || 0), 0);
            const totalCartaoAdicional = cartaoAdicional.reduce((acc, t) => acc + (t.totalAmount || 0), 0);
            const totalParteOutra = parteOutraPessoa.reduce((acc, t) => acc + (t.totalAmount || 0), 0);
            const minhaParte = totalMeusGastos;

            // Header
            doc.setFont('Helvetica', 'bold');
            doc.setFontSize(20);
            doc.text('EXTRATO DO CARTÃO', margin, yPos);
            yPos += 10;

            // Info do período
            doc.setFontSize(10);
            doc.setFont('Helvetica', 'normal');
            const monthStr = currentDate.toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
            doc.text('Período: ' + monthStr, margin, yPos);
            yPos += 8;

            // Resumo por tipo
            doc.setFont('Helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(0, 0, 0);
            doc.text('RESUMO POR TIPO', margin, yPos);
            yPos += 6;

            doc.setFont('Helvetica', 'normal');
            doc.setFontSize(9);
            
            doc.setTextColor(16, 185, 129);
            doc.text('Meus Gastos: ' + formatCurrency(totalMeusGastos) + ' (' + meusGastos.length + ' itens)', margin + 2, yPos);
            yPos += 4;
            
            doc.setTextColor(6, 182, 212);
            doc.text('Cartão Adicional: ' + formatCurrency(totalCartaoAdicional) + ' (' + cartaoAdicional.length + ' itens) - Reembolso', margin + 2, yPos);
            yPos += 4;
            
            doc.setTextColor(245, 158, 11);
            doc.text('Parte Outra Pessoa (Reemb.): ' + formatCurrency(totalParteOutra) + ' (' + parteOutraPessoa.length + ' itens)', margin + 2, yPos);
            yPos += 4;
            
            doc.setTextColor(0, 0, 0);
            doc.setFont('Helvetica', 'bold');
            doc.text('Total Fatura: ' + formatCurrency(cardMetrics.invoice), margin + 2, yPos);
            yPos += 4;
            doc.text('Minha Parte: ' + formatCurrency(minhaParte), margin + 2, yPos);
            yPos += 10;

            // Função auxiliar para renderizar seção
            const renderSection = (title, items, titleColor, showReembolso = false, showDividido = false) => {
              if (items.length === 0) return;
              
              // Verificar se precisa de nova página
              if (yPos > pageHeight - 40) {
                doc.addPage();
                yPos = 15;
              }

              // Título da seção
              doc.setFont('Helvetica', 'bold');
              doc.setFontSize(11);
              doc.setTextColor(titleColor[0], titleColor[1], titleColor[2]);
              doc.text(title, margin, yPos);
              yPos += 6;

              // Headers
              doc.setFont('Helvetica', 'bold');
              doc.setFontSize(8);
              doc.setTextColor(100, 100, 100);
              doc.text('Descrição', margin, yPos);
              doc.text('Categoria', margin + 65, yPos);
              doc.text('Tags', margin + 100, yPos);
              doc.text('Valor', margin + 145, yPos);
              yPos += 4;

              // Linha
              doc.setDrawColor(200, 200, 200);
              doc.line(margin, yPos, pageWidth - margin, yPos);
              yPos += 3;

              // Itens
              doc.setFont('Helvetica', 'normal');
              doc.setFontSize(7);
              let sectionTotal = 0;

              items.forEach((t) => {
                if (yPos > pageHeight - 15) {
                  doc.addPage();
                  yPos = 15;
                }

                const category = t.category || 'Outros';
                const color = categoryColors[category] || '#64748b';
                const colorMatch = color.match(/^#(..)(..)(..)$/);
                const rgbColor = colorMatch ? colorMatch.slice(1).map(x => parseInt(x, 16)) : [100, 100, 100];
                const valor = t.totalAmount || t.myShare || 0;
                sectionTotal += valor;

                // Descrição com cor da categoria
                doc.setTextColor(rgbColor[0], rgbColor[1], rgbColor[2]);
                doc.setFont('Helvetica', 'bold');
                doc.text((t.description || '').substring(0, 30), margin, yPos);

                // Categoria
                doc.setFont('Helvetica', 'normal');
                doc.setTextColor(100, 100, 100);
                doc.text((category || '').substring(0, 15), margin + 65, yPos);

                // Tags
                let tags = [];
                if (t.installments && t.installments.total > 1) {
                  tags.push(t.installments.current + '/' + t.installments.total);
                }
                if (t.isAdditionalCard) {
                  tags.push('Adic: ' + (t.additionalCardPerson || '').substring(0, 8));
                }
                if (t.isSplit && t.splitWith) {
                  tags.push('Div: ' + (t.splitWith || '').substring(0, 8));
                }
                if (t.isFixedExpense) {
                  tags.push('Fixo');
                }
                doc.setFontSize(6);
                doc.setTextColor(150, 150, 150);
                doc.text(tags.join(' | ').substring(0, 25), margin + 100, yPos);
                doc.setFontSize(7);

                // Valor
                doc.setTextColor(50, 50, 50);
                if (showReembolso) {
                  doc.setTextColor(6, 182, 212);
                  doc.text(formatCurrency(valor) + ' (reemb.)', margin + 145, yPos);
                } else if (showDividido && t.myShare) {
                  doc.text(formatCurrency(t.myShare) + ' / ' + formatCurrency(valor), margin + 145, yPos);
                } else {
                  doc.text(formatCurrency(valor), margin + 145, yPos);
                }

                yPos += lineHeight;
              });

              // Subtotal da seção
              yPos += 2;
              doc.setFont('Helvetica', 'bold');
              doc.setFontSize(8);
              doc.setTextColor(titleColor[0], titleColor[1], titleColor[2]);
              doc.text('Subtotal: ' + formatCurrency(sectionTotal), margin + 120, yPos);
              yPos += 8;
            };

            // Renderizar seções
            renderSection('MEUS GASTOS', meusGastos, [16, 185, 129], false, false);
            renderSection('CARTÃO ADICIONAL (Reembolso)', cartaoAdicional, [6, 182, 212], true, false);
            renderSection('PARTE OUTRA PESSOA (Reembolso)', parteOutraPessoa, [245, 158, 11], true, false);

            // Footer com totais
            if (yPos > pageHeight - 30) {
              doc.addPage();
              yPos = 15;
            }
            yPos += 5;
            doc.setDrawColor(100, 100, 100);
            doc.line(margin, yPos, pageWidth - margin, yPos);
            yPos += 8;

            doc.setFont('Helvetica', 'bold');
            doc.setFontSize(10);
            doc.setTextColor(0, 0, 0);
            doc.text('TOTAL FATURA: ' + formatCurrency(cardMetrics.invoice), margin, yPos);
            yPos += 5;
            doc.setTextColor(16, 185, 129);
            doc.text('MINHA PARTE: ' + formatCurrency(minhaParte), margin, yPos);
            yPos += 5;
            doc.setTextColor(6, 182, 212);
            doc.text('A RECEBER (Reembolsos): ' + formatCurrency(totalCartaoAdicional + totalParteOutra), margin, yPos);

            // Data de geração
            yPos = pageHeight - 10;
            doc.setFont('Helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 150);
            const dataGeracao = new Date().toLocaleString('pt-BR');
            doc.text('Gerado em: ' + dataGeracao, margin, yPos);

            // Salvar
            const filename = 'extrato-cartao-' + monthStr.toLowerCase().replace(' ', '-') + '.pdf';
            doc.save(filename);
          } catch (error) {
            console.error('Erro ao gerar PDF:', error);
            alert('Erro ao gerar PDF do extrato: ' + error.message);
          }
        };

        // Função para exportar resumo mensal em PDF
        const exportResumoMensalPDF = (fluxoMetrics, cardMetrics, apeMetrics, currentDate, currentTotalWealth, targetAssets, transactions, fluxoTransactions, fixedExpenses, apeTransactions) => {

        // useStickyState: wrapper around localStorage with DEBOUNCED writes for performance
        // Instead of writing on every state change, batches writes with requestIdleCallback/setTimeout
        const _stickyWriteQueue = {};
        let _stickyFlushScheduled = false;
        function _flushStickyWrites() {
          _stickyFlushScheduled = false;
          const entries = Object.entries(_stickyWriteQueue);
          for (const [key, value] of entries) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
            delete _stickyWriteQueue[key];
          }
        }
        function _scheduleStickyFlush() {
          if (_stickyFlushScheduled) return;
          _stickyFlushScheduled = true;
          if (typeof requestIdleCallback === 'function') {
            requestIdleCallback(_flushStickyWrites, { timeout: 2000 });
          } else {
            setTimeout(_flushStickyWrites, 500);
          }
        }
        // Pre-read all localStorage keys in one batch at startup to avoid repeated sync reads
        const _localStorageCache = {};
        function _preloadLocalStorage() {
          try {
            for (let i = 0; i < localStorage.length; i++) {
              const key = localStorage.key(i);
              if (key && key.startsWith('fin_')) {
                _localStorageCache[key] = localStorage.getItem(key);
              }
            }
          } catch(e) {}
        }
        _preloadLocalStorage();

        function useStickyState(defaultValue, key) {
          const [state, setState] = React.useState(() => {
            try {
              const raw = _localStorageCache[key] !== undefined ? _localStorageCache[key] : localStorage.getItem(key);
              return raw ? JSON.parse(raw) : defaultValue;
            } catch (e) {
              return defaultValue;
            }
          });
          // Use a ref to track if this is the initial mount — skip writing on mount
          const isInitial = React.useRef(true);
          React.useEffect(() => {
            if (isInitial.current) { isInitial.current = false; return; }
            _stickyWriteQueue[key] = state;
            _scheduleStickyFlush();
          }, [key, state]);
          return [state, setState];
        }

                                id: Date.now() + Math.random(), description: fe.description, totalAmount: adjustedAmount, myShare: myShare, 
                                mySharePercent: Math.round((myShare / adjustedAmount) * 100), category: fe.category, paymentMethod: 'Crédito', 
                                type: 'fixo', installments: { current: 1, total: 1 }, date: transactionDate, isSplit: true, splitWith: fe.paymentRecipient,
                                isFixedExpense: true, fixedExpenseId: fe.id, isPayingForOthers: true, divideWith: fe.divideWith || []
                              });
                              hasUpdates = true;
                            } else if (fe.isShared) {
                              const myShare = adjustedAmount * 0.5;
                              newTransactions.push({ 
                                id: Date.now() + Math.random(), description: fe.description, totalAmount: adjustedAmount, myShare: myShare, 
                                mySharePercent: 50, category: fe.category, paymentMethod: 'Crédito', type: 'fixo', 
                                installments: { current: 1, total: 1 }, date: transactionDate, isSplit: true, splitWith: fe.splitWith || null,
                                isFixedExpense: true, fixedExpenseId: fe.id 
                              });
                              hasUpdates = true;
                            } else {
                              newTransactions.push({ 
                                id: Date.now() + Math.random(), description: fe.description, totalAmount: adjustedAmount, myShare: adjustedAmount, 
                                mySharePercent: 100, category: fe.category, paymentMethod: 'Crédito', type: 'fixo', 
                                installments: { current: 1, total: 1 }, date: transactionDate, isSplit: false, splitWith: null,
                                isFixedExpense: true, fixedExpenseId: fe.id 
                              });
                              hasUpdates = true;
                            }
                        }
                    }
                });
                if (hasUpdates) return [...filtered, ...newTransactions];
                return prevTransactions;
            });

            // 2) Espelhar gastos fixos não-crédito para fluxo
            setFluxoTransactions(prevFluxo => {
                const newFluxoItems = [];
                let hasUpdates = false;
                
                // Remover entradas espelhadas desatualizadas
                let filtered = prevFluxo.filter(t => {
                    if (t.isFixedExpense && t.fixedExpenseId && t.date.startsWith(monthKey)) {
                        const fe = fixedExpenses.find(f => f.id === t.fixedExpenseId);
                        if (!fe || fe.paymentMethod === 'Crédito' || isFixedExpenseDeactivated(fe, currentDate)) {
                            hasUpdates = true;
                            return false;
                        }
                        const adjustedAmount = getFixedExpenseAmountForMonth(fe, currentDate);
                        const expectedAmount = fe.isShared ? adjustedAmount / 2 : (fe.isPayingForOthers && fe.divideWith ? adjustedAmount / (fe.divideWith.length + 1) : adjustedAmount);
                        if (t.amount !== expectedAmount || !t.description.startsWith(fe.description)) {
                            hasUpdates = true;
                            return false;
                        }
                    }
                    return true;
                });

                fixedExpenses.forEach(fe => {
                    if (fe.paymentMethod !== 'Crédito' && !isFixedExpenseDeactivated(fe, currentDate)) {
                        const exists = filtered.some(t => t.fixedExpenseId === fe.id && t.date.startsWith(monthKey));
                        if (!exists) {
                            const transactionDate = `${monthKey}-01`;
                            const adjustedAmount = getFixedExpenseAmountForMonth(fe, currentDate);
                            
                            if (fe.isPayingForOthers && fe.paymentRecipient && fe.divideWith && fe.divideWith.length > 0) {
                              const myShare = adjustedAmount / (fe.divideWith.length + 1);
                              newFluxoItems.push({
                                id: Date.now() + Math.random(), description: `${fe.description} (${fe.paymentMethod})`, amount: myShare,
                                type: 'expense', category: fe.category || 'Outros', person: '', date: transactionDate, isFixedExpense: true,
                                fixedExpenseId: fe.id, paid: false, isPayingForOthers: true, paymentRecipient: fe.paymentRecipient,
                                divideWith: fe.divideWith || []
                              });
                            } else if (fe.isShared) {
                              newFluxoItems.push({
                                id: Date.now() + Math.random(), description: `${fe.description} (${fe.paymentMethod})`, amount: adjustedAmount / 2,
                                type: 'expense', category: fe.category || 'Outros', person: fe.splitWith || '', date: transactionDate,
                                isFixedExpense: true, fixedExpenseId: fe.id, paid: false
                              });
                            } else {
                              newFluxoItems.push({
                                id: Date.now() + Math.random(), description: `${fe.description} (${fe.paymentMethod})`, amount: adjustedAmount,
                                type: 'expense', category: fe.category || 'Outros', person: '', date: transactionDate,
                                isFixedExpense: true, fixedExpenseId: fe.id, paid: false
                              });
                            }
                            hasUpdates = true;
                        }
                    }
                });
                if (hasUpdates) return [...filtered, ...newFluxoItems];
                return prevFluxo;
            });

            // 3) Criar saldos automáticos para gastos fixos com "pagar para"
            setDebtPayments(prevDebts => {
              let updated = false;
              const newDebts = [...prevDebts];

              fixedExpenses.forEach(fe => {
                if (fe.isPayingForOthers && fe.paymentRecipient && !isFixedExpenseDeactivated(fe, currentDate)) {
                  const transactionDate = `${monthKey}-01`;
                  const adjustedAmount = getFixedExpenseAmountForMonth(fe, currentDate);

                  // Só cria dívida 'pagar' para métodos não-crédito (crédito já paga via fatura do cartão)
                  if (fe.paymentMethod !== 'Crédito') {
                    const paymentDebtKey = `${fe.id}_payment_${monthKey}`;
                    const existsPayment = newDebts.some(d => d.id === paymentDebtKey);
                    if (!existsPayment) {
                      newDebts.push({
                        id: paymentDebtKey, type: 'pagar', person: fe.paymentRecipient, amount: adjustedAmount,
                        date: transactionDate, isPaid: false, description: fe.description, isFixedExpense: true, fixedExpenseId: fe.id
                      });
                      updated = true;
                    }
                  }

                  if (fe.divideWith && Array.isArray(fe.divideWith)) {
                    fe.divideWith.forEach(person => {
                      const personShareDebtKey = `${fe.id}_share_${person}_${monthKey}`;
                      const existsShare = newDebts.some(d => d.id === personShareDebtKey);
                      if (!existsShare) {
                        const personShare = adjustedAmount / (fe.divideWith.length + 1);
                        newDebts.push({
                          id: personShareDebtKey, type: 'receber', person: person, amount: personShare,
                          date: transactionDate, isPaid: false, description: `Sua parte: ${fe.description}`,
                          isFixedExpense: true, fixedExpenseId: fe.id
                        });
                        updated = true;
                      }
                    });
                  }
                }
              });

              return updated ? newDebts : prevDebts;
            });
          }, [currentDate, fixedExpenses, isLoadingFromServer]);

          // --- LÓGICA: CARTÃO ---
          const currentCardTransactions = useMemo(() => transactions.filter(t => {
            const d = new Date(t.date + 'T12:00:00');
            return d.getMonth() === currentDate.getMonth() && d.getFullYear() === currentDate.getFullYear();
          }), [transactions, currentDate]);

          const cardMetrics = useMemo(() => {
            let invoice=0, myCost=0, fixed=0, install=0, variable=0;
            let totalMeuSomente=0, totalDivididos=0, totalAdicional=0; // Breakdown
            let meuSomenteMinhaParte=0, dividiosMinhaParte=0; // Minha parte de cada tipo
            const catMap = {}, reimbursement = {};
             
            currentCardTransactions.forEach(t => {
               invoice += t.totalAmount; 
               // myCost só deve incluir gastos que NÃO são do cartão adicional
               // Cartão adicional é 100% reembolsado, então não conta como "minha parte"
               if (!t.isAdditionalCard) {
                 myCost += t.myShare;
               }
               // Breakdown por tipo (exclui cartão adicional para consistência com myCost)
               if (!t.isAdditionalCard) {
                 if (t.type === 'parcelado') install += t.myShare; else if (t.type === 'fixo') fixed += t.myShare; else variable += t.myShare;
               }
               
               // Breakdown por tipo
               if (t.isAdditionalCard) {
                 totalAdicional += t.totalAmount;
               } else if (t.isSplit) {
                 totalDivididos += t.totalAmount;
                 dividiosMinhaParte += t.myShare;
               } else {
                 totalMeuSomente += t.totalAmount;
                 meuSomenteMinhaParte += t.myShare;
               }
               
               // Só contabiliza no gráfico de categorias se não for cartão adicional nem gasto fixo dividido
               if (!t.isAdditionalCard && !(t.isFixedExpense && t.isSplit)) {
                 catMap[t.category] = (catMap[t.category] || 0) + t.myShare;
               }
               // Reembolsos de despesas divididas (exclui isPayingForOthers pois o sistema de dívidas já trata)
               // Também exclui se o gasto fixo foi pausado neste mês
               const isFixedPausedThisMonth = t.isFixedExpense && t.fixedExpenseId && fixedExpenses.find(fe => fe.id === t.fixedExpenseId && isFixedExpenseDeactivated(fe, currentDate));
               if (t.isSplit && t.splitWith && !t.isPayingForOthers && !isFixedPausedThisMonth) {
                 if (!reimbursement[t.splitWith]) reimbursement[t.splitWith] = { total: 0, items: [] };
                 reimbursement[t.splitWith].total += (t.totalAmount - t.myShare);
                 reimbursement[t.splitWith].items.push(t);
               }
               // Reembolsos de cartão adicional (valor total vai para reembolso)
               if (t.isAdditionalCard && t.additionalCardPerson) {
                 if (!reimbursement[t.additionalCardPerson]) reimbursement[t.additionalCardPerson] = { total: 0, items: [] };
                 reimbursement[t.additionalCardPerson].total += t.totalAmount;
                 reimbursement[t.additionalCardPerson].items.push(t);
               }
            });
             
            const pieData = Object.entries(catMap).map(([name, value]) => ({ name, value }));
            // Pagamentos do mês
            const monthKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
            const totalPaid = cardPayments.filter(p => p.monthKey === monthKey).reduce((acc, p) => acc + p.amount, 0);
            // Saldo disponível = Limite - Minha Parte + Já Pago (pagar libera limite)
            const free = budgetSettings.totalLimit - myCost + totalPaid;
            const installmentsPercentage = Math.min((install / budgetSettings.installmentAlert) * 100, 100);

            return { 
              invoice, myCost, reimbursementTotal: invoice - myCost, fixed, install, variable, free, reimbursement, catMap, pieData, installmentsPercentage,
              // Breakdown
              totalMeuSomente, totalDivididos, totalAdicional,
              meuSomenteMinhaParte, dividiosMinhaParte,
              totalPaid
            };
          }, [currentCardTransactions, budgetSettings, cardPayments, currentDate, fixedExpenses]);

          const filteredCardTransactions = useMemo(() => {
            let filtered = categoryFilter === 'Todas' ? currentCardTransactions : currentCardTransactions.filter(t => t.category === categoryFilter);
            
            // Aplicar ordenação
            switch(sortOrder) {
              case 'alfabetica':
                return [...filtered].sort((a, b) => a.description.localeCompare(b.description));
              case 'categoria':
                return [...filtered].sort((a, b) => a.category.localeCompare(b.category));
              case 'valor-maior':
                return [...filtered].sort((a, b) => b.myShare - a.myShare);
              case 'valor-menor':
                return [...filtered].sort((a, b) => a.myShare - b.myShare);
              case 'recente':
              default:
                return [...filtered].sort((a, b) => b.id - a.id);
            }
          }, [currentCardTransactions, categoryFilter, sortOrder]);

          // --- LÓGICA: SALDO COM PESSOAS (Reembolsos - Pagamentos) ---
          const peopleBalances = useMemo(() => {
            const balances = {};
            const monthKey = getMonthKey(currentDate);
            
            // Inicializar todas as pessoas
            people.forEach(p => {
              balances[p] = { toReceive: 0, toPay: 0, balance: 0, reimbursementItems: [], paymentItems: [], apeMirrorItems: [] };
            });
            
            // Adicionar reembolsos do cartão (o que as pessoas me devem)
            Object.entries(cardMetrics.reimbursement).forEach(([person, data]) => {
              if (!balances[person]) balances[person] = { toReceive: 0, toPay: 0, balance: 0, reimbursementItems: [], paymentItems: [], apeMirrorItems: [] };
              balances[person].toReceive += data.total;
              balances[person].reimbursementItems = [...(balances[person].reimbursementItems || []), ...data.items];
            });
            
            // Adicionar espelhamento de gastos dos Apês (100% vai para a pessoa espelhada)
            ['ape1', 'ape2'].forEach(apeId => {
              const settings = apeSettings[apeId] || {};
              const mirrorPerson = settings.mirrorPerson;
              const isFixed = settings.isFixed;
              const disabledMonths = settings.disabledMonths || [];
              
              // Verificar se está ativo para este mês (fixo e não desabilitado, ou não fixo)
              const isActiveThisMonth = mirrorPerson && people.includes(mirrorPerson) && !disabledMonths.includes(monthKey);
              
              if (isActiveThisMonth) {
                if (!balances[mirrorPerson]) balances[mirrorPerson] = { toReceive: 0, toPay: 0, balance: 0, reimbursementItems: [], paymentItems: [], apeMirrorItems: [] };
                // Pegar transações deste apê no mês atual
                const apeTransThisMonth = apeTransactions.filter(t => t.apeId === apeId && t.date.startsWith(monthKey));
                apeTransThisMonth.forEach(t => {
                  // 100% do valor vai para a pessoa (ela me reembolsa tudo)
                  const fullAmount = t.amount;
                  balances[mirrorPerson].toReceive += fullAmount;
                  balances[mirrorPerson].apeMirrorItems.push({ ...t, mirroredAmount: fullAmount, apeId });
                });
              }
            });
            
            // Processar pagamentos feitos/recebidos
            debtPayments.filter(p => p.date.startsWith(monthKey)).forEach(payment => {
              if (!balances[payment.person]) balances[payment.person] = { toReceive: 0, toPay: 0, balance: 0, reimbursementItems: [], paymentItems: [], apeMirrorItems: [] };
              if (payment.type === 'receber') {
                if (payment.isPaid) {
                  // Já recebi da pessoa (abate do que ela me deve)
                  // Não adiciona porque já foi quitado
                } else {
                  // Pendente de receber (soma ao que ela me deve)
                  balances[payment.person].toReceive += payment.amount;
                }
              } else {
                // Eu paguei para a pessoa (aumenta o que eu paguei/devo)
                if (!payment.isPaid) {
                  balances[payment.person].toPay += payment.amount;
                }
              }
              balances[payment.person].paymentItems.push(payment);
            });
            
            // Calcular saldo líquido (positivo = tenho a receber, negativo = devo)
            Object.keys(balances).forEach(person => {
              // toReceive é o que ela me deve, toPay é o que eu paguei/devo a ela
              // balance = toReceive - toPay (se positivo, ela me deve; se negativo, eu devo)
              balances[person].balance = balances[person].toReceive - balances[person].toPay;
            });
            
            return balances;
          }, [people, cardMetrics.reimbursement, debtPayments, currentDate, apeSettings, apeTransactions]);

          // Total geral de saldos
          const totalPeopleBalance = useMemo(() => {
            let toReceive = 0, toPay = 0;
            Object.values(peopleBalances).forEach(b => {
              if (b.balance > 0) toReceive += b.balance;
              else toPay += Math.abs(b.balance);
            });
            return { toReceive, toPay, net: toReceive - toPay };
          }, [peopleBalances]);

          // Combina cores padrão com cores customizadas do usuário
          const allAvailableColors = useMemo(() => {
            return [...AVAILABLE_COLORS.slice(0, 8), ...customColorsPalette];
          }, [customColorsPalette]);

          // --- LÓGICA: FLUXO DE CAIXA ---
          const currentFluxo = useMemo(() => {
            let filtered = fluxoTransactions.filter(t => t.date.startsWith(getMonthKey(currentDate)));
            if (fluxoCategoryFilter !== 'Todas') {
              filtered = filtered.filter(t => t.category === fluxoCategoryFilter);
            }
            if (fluxoPersonFilter !== 'Todas') {
              filtered = filtered.filter(t => t.person === fluxoPersonFilter);
            }
            return filtered;
          }, [fluxoTransactions, currentDate, fluxoCategoryFilter, fluxoPersonFilter]);
           
          const fluxoCategoryData = useMemo(() => {
            const map = {};
            currentFluxo.filter(t => t.type === 'expense').forEach(t => map[t.category] = (map[t.category] || 0) + t.amount);
            if (cardMetrics.myCost > 0) {
              map['Cartão de Crédito'] = (map['Cartão de Crédito'] || 0) + cardMetrics.myCost;
            }
            return Object.entries(map).map(([name, value]) => ({ name, value }));
          }, [currentFluxo, cardMetrics.myCost]);

          // Dados de gastos por pessoa (sem filtro, mostra tudo do mês)
          const fluxoPersonData = useMemo(() => {
            const allFluxoMonth = fluxoTransactions.filter(t => t.date.startsWith(getMonthKey(currentDate)));
            const map = {};
            allFluxoMonth.filter(t => t.type === 'expense' && t.person).forEach(t => {
              map[t.person] = (map[t.person] || 0) + t.amount;
            });
            return Object.entries(map).map(([name, value]) => ({ name, value }));
          }, [fluxoTransactions, currentDate]);

          // --- LÓGICA: OBRAS ---
          const allApeTransMonth = useMemo(() => apeTransactions.filter(t => t.date.startsWith(getMonthKey(currentDate))), [apeTransactions, currentDate]);
          const currentApeTrans = useMemo(() => allApeTransMonth.filter(t => t.apeId === selectedApe), [allApeTransMonth, selectedApe]);
          
          // Dados de gastos por categoria em Obras (pizza chart)
          const apeCategoryData = useMemo(() => {
            const map = {};
            currentApeTrans.forEach(t => {
              map[t.category] = (map[t.category] || 0) + t.amount;
            });
            return Object.entries(map).map(([name, value]) => ({ name, value }));
          }, [currentApeTrans]);
           
          const apeMetrics = useMemo(() => {
            const monthTotalAll = allApeTransMonth.reduce((acc, t) => acc + t.amount, 0); 
            const totalAccumulatedAll = apeTransactions.reduce((acc, t) => acc + t.amount, 0); 
            const totalApe1 = apeTransactions.filter(t => t.apeId === 'ape1').reduce((acc, t) => acc + t.amount, 0);
            const totalApe2 = apeTransactions.filter(t => t.apeId === 'ape2').reduce((acc, t) => acc + t.amount, 0);
            // Gastos do mês por ape
            const ape1Month = allApeTransMonth.filter(t => t.apeId === 'ape1').reduce((acc, t) => acc + t.amount, 0);
            const ape2Month = allApeTransMonth.filter(t => t.apeId === 'ape2').reduce((acc, t) => acc + t.amount, 0);
            
            // Verificar se espelhamento está ativo para cada apê (considerando isFixed e disabledMonths)
            const monthKey = getMonthKey(currentDate);
            const ape1Settings = apeSettings.ape1 || {};
            const ape2Settings = apeSettings.ape2 || {};
            const ape1MirrorActive = ape1Settings.mirrorPerson && !(ape1Settings.disabledMonths || []).includes(monthKey);
            const ape2MirrorActive = ape2Settings.mirrorPerson && !(ape2Settings.disabledMonths || []).includes(monthKey);
            
            // Minha parte considerando espelhamento (100% vai para a pessoa = minha parte é 0)
            const ape1MyShare = ape1MirrorActive ? 0 : ape1Month;
            const ape2MyShare = ape2MirrorActive ? 0 : ape2Month;
            const selectedMonthTotal = currentApeTrans.reduce((acc, t) => acc + t.amount, 0);
            const selectedAccumulated = apeTransactions.filter(t => t.apeId === selectedApe).reduce((acc, t) => acc + t.amount, 0);
            // Minha parte do apê selecionado
            const selectedSettings = apeSettings[selectedApe] || {};
            const selectedMirrorActive = selectedSettings.mirrorPerson && !(selectedSettings.disabledMonths || []).includes(monthKey);
            const selectedMyShare = selectedMirrorActive ? 0 : selectedMonthTotal;
            return { monthTotalAll, totalAccumulatedAll, totalApe1, totalApe2, ape1Month, ape2Month, ape1MyShare, ape2MyShare, ape1MirrorActive, ape2MirrorActive, selectedMonthTotal, selectedAccumulated, selectedMyShare };
          }, [allApeTransMonth, apeTransactions, currentApeTrans, selectedApe, apeSettings, currentDate]);

          // Métricas do Fluxo de Caixa (depois de apeMetrics para poder usar ape1Month/ape2Month)
          const fluxoMetrics = useMemo(() => {
            const paidBillsKey = `${currentDate.getMonth()}_${currentDate.getFullYear()}`;
            const currentPaidBills = paidBillsMonth[paidBillsKey] || {};
            const isBillPaidCheck = (key) => currentPaidBills[key]?.paid || false;
            
            // Pagamentos parciais do cartão deste mês
            const monthKey = getMonthKey(currentDate);
            const cardPaymentsThisMonth = cardPayments.filter(p => p.monthKey === monthKey);
            const totalCardPayments = cardPaymentsThisMonth.reduce((acc, p) => acc + p.amount, 0);
            
            // Saldo positivo com pessoas (o que as pessoas me devem) - apenas para exibição, não soma em entrada
            const saldoPositivoPessoas = Object.values(peopleBalances)
              .filter(b => b.balance > 0)
              .reduce((acc, b) => acc + b.balance, 0);
            
            // Usar dados NÃO filtrados do mês para métricas (filtros de categoria/pessoa só afetam a listagem)
            const allFluxoMonth = fluxoTransactions.filter(t => t.date.startsWith(monthKey));
            
            // ENTRADAS - apenas receitas registradas (saldo com pessoas é separado)
            const incomeFluxo = allFluxoMonth.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const incomeUsedForCard = allFluxoMonth.filter(t => t.type === 'income').reduce((acc, t) => acc + (t.usedForCardPayment || 0), 0);
            const income = incomeFluxo; // NÃO inclui saldo com pessoas
            
            // SAÍDAS MANUAIS - despesas manuais já registradas/pagas (excluindo as que vieram de gastos fixos para não duplicar)
            const manualExpense = allFluxoMonth.filter(t => t.type === 'expense' && !t.isFixedExpense).reduce((acc, t) => acc + t.amount, 0);
            
            // Gastos fixos não-crédito (PIX, Débito, Boleto)
            // Exclui isPayingForOthers pois o sistema de dívidas já contabiliza o valor total via pessoasPendentes/pessoasPagas
            const fixedNonCreditExpenses = fixedExpenses.filter(fe => fe.paymentMethod !== 'Crédito' && !fe.isPayingForOthers);
            // Para gastos divididos (isShared), conta apenas a minha parte (metade)
            const getMyShareOfFixed = (fe, date) => {
              const amount = getFixedExpenseAmountForMonth(fe, date);
              if (fe.isShared) return amount / 2;
              return amount;
            };
            const fixedNonCreditPendente = fixedNonCreditExpenses
              .filter(fe => !isBillPaidCheck(`fixed_${fe.id}`))
              .reduce((acc, fe) => acc + getMyShareOfFixed(fe, currentDate), 0);
            const fixedNonCreditPago = fixedNonCreditExpenses
              .filter(fe => isBillPaidCheck(`fixed_${fe.id}`))
              .reduce((acc, fe) => acc + getMyShareOfFixed(fe, currentDate), 0);
            
            // Calcular pendente e pago para cada Apê (por transação individual)
            // Considera espelhamento: se tem pessoa espelhada, minha parte é 0 (100% vai para ela)
            const ape1Trans = allApeTransMonth.filter(t => t.apeId === 'ape1');
            const ape2Trans = allApeTransMonth.filter(t => t.apeId === 'ape2');
            
            // Verificar se espelhamento está ativo (você paga 100% ao banco, pessoa te reembolsa)
            const ape1Settings = apeSettings.ape1 || {};
            const ape2Settings = apeSettings.ape2 || {};
            const ape1MirrorActive = ape1Settings.mirrorPerson && !(ape1Settings.disabledMonths || []).includes(monthKey);
            const ape2MirrorActive = ape2Settings.mirrorPerson && !(ape2Settings.disabledMonths || []).includes(monthKey);
            
            // Você paga 100% ao banco, independente do espelhamento (pessoa te reembolsa depois)
            const ape1Pendente = ape1Trans.filter(t => !isBillPaidCheck(`ape_${t.id}`)).reduce((acc, t) => acc + t.amount, 0);
            const ape1Pago = ape1Trans.filter(t => isBillPaidCheck(`ape_${t.id}`)).reduce((acc, t) => acc + t.amount, 0);
            const ape2Pendente = ape2Trans.filter(t => !isBillPaidCheck(`ape_${t.id}`)).reduce((acc, t) => acc + t.amount, 0);
            const ape2Pago = ape2Trans.filter(t => isBillPaidCheck(`ape_${t.id}`)).reduce((acc, t) => acc + t.amount, 0);
            
            // PENDENTE NO MÊS - o que ainda precisa pagar (considerando pagamentos parciais)
            const cartaoRestante = Math.max(0, cardMetrics.invoice - totalCardPayments);
            const cartaoPendente = isBillPaidCheck('cartao') ? 0 : cartaoRestante;
            const pessoasPendentes = Object.entries(peopleBalances)
              .filter(([_, b]) => b.balance < 0)
              .reduce((acc, [person, b]) => acc + (isBillPaidCheck(`pessoa_${person}`) ? 0 : Math.abs(b.balance)), 0);
            const pendingTotal = cartaoPendente + ape1Pendente + ape2Pendente + pessoasPendentes + fixedNonCreditPendente;
            
            // SAÍDAS TOTAIS = despesas manuais + o que já foi pago das contas pendentes + pagamentos parciais do cartão
            const cartaoPago = isBillPaidCheck('cartao') ? cardMetrics.invoice : totalCardPayments;

ded"><Plus size={14}/></button></div></div>)}</div>

                                min="0"

                                placeholder="0,00"

                          </div>

                        </div>

                          <div>

                            {(() => {
                              // Filtrar apenas compras parceladas (com installments.total > 1)
                              let installmentTransactions = currentCardTransactions.filter(t => 
                                t.installments && t.installments.total > 1
                              );
                              
                              // Agrupar por description para evitar duplicatas (mesma compra em múltiplas parcelas)
                              const groupedByDescription = {};
                              installmentTransactions.forEach(t => {
                                if (!groupedByDescription[t.description]) {
                                  groupedByDescription[t.description] = t;
                                }
                              });

                              const uniqueInstallments = Object.values(groupedByDescription);
                              
                              return uniqueInstallments.length > 0 ? (
                                <select 
                                  value={refundForm.selectedTransaction?.description || ''}
                                  onChange={e => {
                                    const selectedDesc = e.target.value;
                                    const trans = uniqueInstallments.find(t => t.description === selectedDesc);
                                    setRefundForm({ ...refundForm, selectedTransaction: trans, parcelsToRefund: 1 });
                                  }}
                                  className={`w-full rounded-lg p-3 text-sm ${themeClasses.input}`}

                                  <option value="">Escolha uma compra...</option>

                              id: Date.now(),
                              monthKey: monthKey,
                              amount: amount,
                              description: payCardDesc || `Pagamento via ${sourceIncome.description}`,

                              sourceId: sourceIncome.id,
                              sourceName: sourceIncome.description

                              t.id === sourceIncome.id 
                                ? { ...t, usedForCardPayment: (t.usedForCardPayment || 0) + amount }
                                : t

                            // Adicionar pagamento
                            setCardPayments(prev => [...prev, newPayment]);
                            
                            // Fechar modal e resetar
                            setShowPayCardModal(false);
                            setPayCardAmount('');
                            setPayCardSource('');
                            setPayCardDesc('');

        function AssetInput({ label, icon, color, colorHex, value, onChange, themeClasses }) { 
            const [inputValue, setInputValue] = React.useState(value === 0 ? '' : String(value));
            
            // Atualizar inputValue quando value externo mudar
            React.useEffect(() => {
              setInputValue(value === 0 ? '' : String(value));
            }, [value]);
            
            // Função para avaliar expressão matemática simples
            const evaluateExpression = (expr) => {
              try {
                // Remove espaços
                const cleaned = expr.replace(/\s/g, '');
                // Verifica se contém operadores matemáticos
                if (/[\+\-\*\/]/.test(cleaned) && /\d/.test(cleaned)) {
                  // Avalia a expressão de forma segura (só números e operadores básicos)
                  // Substitui vírgula por ponto para decimais
                  const normalized = cleaned.replace(/,/g, '.');
                  // Usa Function para avaliar (mais seguro que eval para expressões simples)
                  const result = new Function('return ' + normalized)();
                  if (typeof result === 'number' && !isNaN(result) && isFinite(result)) {
                    return result;
                  }
                }
                // Se não for expressão, retorna o número parseado
                return parseFloat(cleaned.replace(/,/g, '.')) || 0;
              } catch (e) {
                return parseFloat(expr.replace(/,/g, '.')) || 0;
              }
            };
            
            const handleBlur = () => {
              const result = evaluateExpression(inputValue);
              setInputValue(result === 0 ? '' : String(result));
              onChange(result);
            };
            
            const handleKeyDown = (e) => {
              if (e.key === 'Enter') {
                e.target.blur();
              }
            };
            
            return (
                <div className={`p-3 rounded-xl border focus-within:border-opacity-50 transition-all flex items-center justify-between gap-4 group ${themeClasses.card} ${themeClasses.border}`}>

                          onKeyDown={handleKeyDown}

                          placeholder="0.00" 
                        />
                    </div>
                </div>
            );

        // Global in-DOM error banner to show uncaught errors (useful when React tree crashes)
        (function installGlobalErrorBanner(){
          if (document.getElementById('global-error-overlay')) return;
          const banner = document.createElement('div');
          banner.id = 'global-error-overlay';
          banner.style.position = 'fixed';
          banner.style.top = '10px';
          banner.style.left = '50%';
          banner.style.transform = 'translateX(-50%)';
          banner.style.zIndex = 99999;
          banner.style.background = 'rgba(220,38,38,0.95)';
          banner.style.color = '#fff';
          banner.style.padding = '10px 14px';
          banner.style.borderRadius = '8px';
          banner.style.fontFamily = 'monospace';
          banner.style.fontSize = '13px';
          banner.style.display = 'none';
          banner.style.maxWidth = '90%';
          banner.style.boxShadow = '0 6px 18px rgba(0,0,0,0.4)';
          document.body.appendChild(banner);

          window.addEventListener('error', (e) => {
            try { banner.textContent = `Erro: ${e.message || e.error?.message || 'uncaught error'}`; banner.style.display = 'block'; console.error('window.onerror', e); } catch (err) { console.error(err); }
          });
          window.addEventListener('unhandledrejection', (ev) => {
            try { banner.textContent = `Promise rejection: ${ev.reason?.message || String(ev.reason)}`; banner.style.display = 'block'; console.error('unhandledrejection', ev); } catch (err) { console.error(err); }
          });

        class ErrorBoundary extends React.Component {
          constructor(props) { super(props); this.state = { hasError: false, error: null, info: null }; }
          static getDerivedStateFromError(error) { return { hasError: true, error }; }
          componentDidCatch(error, info) { console.error('ErrorBoundary caught', error, info); this.setState({ info }); const b = document.getElementById('global-error-overlay'); if (b) { b.textContent = `Render error: ${error.message}`; b.style.display='block'; } }
          render() {
            if (this.state.hasError) {
              return (
                <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
                  <div style={{ background: '#111', color: '#fff', borderRadius: 12, padding: 20, maxWidth: 900, boxShadow: '0 8px 30px rgba(0,0,0,0.6)', fontFamily: 'system-ui, -apple-system, Roboto, "Segoe UI", sans-serif' }}>
                    <h2 style={{ marginTop: 0 }}>Opa — ocorreu um erro.</h2>
                    <pre style={{ whiteSpace: 'pre-wrap', maxHeight: '50vh', overflow: 'auto', background: '#000', color: '#fff', padding: 12, borderRadius: 8 }}>{this.state.error && this.state.error.stack ? this.state.error.stack : String(this.state.error)}</pre>
                    <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                      <button onClick={() => window.location.reload()} style={{ background: '#10b981', color: '#fff', border: 0, padding: '8px 12px', borderRadius: 8 }}>Recarregar</button>
                      <button onClick={() => { const b = document.getElementById('global-error-overlay'); if (b) b.style.display='none'; this.setState({ hasError: false, error: null, info: null }); }} style={{ background: '#374151', color: '#fff', border: 0, padding: '8px 12px', borderRadius: 8 }}>Fechar</button>
                    </div>
                    <p style={{ fontSize: 12, color: '#9ca3af', marginTop: 10 }}>Cole aqui o stack acima ao me enviar para eu analisar o problema.</p>
                  </div>
                </div>
              );
            }
            return this.props.children;
          }
        }

        console.log('Iniciando aplicação...');
        console.log('React disponível:', typeof React);
        console.log('ReactDOM disponível:', typeof ReactDOM);
        console.log('Recharts disponível:', typeof Recharts);
        
        try {
          const container = document.getElementById('root');
          console.log('Container encontrado:', container);
          const root = createRoot(container);
          console.log('Root criado, renderizando...');
          root.render(
            <ErrorBoundary>
              <FinanceDashboard />
            </ErrorBoundary>
          );
          console.log('Render chamado com sucesso');
        } catch (err) {
          console.error('Erro ao renderizar:', err);
          document.getElementById('root').innerHTML = '<div style="color:red;padding:20px;">Erro: ' + err.message + '</div>';
        }
    </script>
</body>
</html>
